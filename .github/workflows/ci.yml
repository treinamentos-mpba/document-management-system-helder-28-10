name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm install

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm install

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      - name: Testar backend
        working-directory: backend
        run: npm test